<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🎫 TicketHub</h1>
            <p>Sign in to access your support panel</p>
        </div>

        <div id="error-message" class="alert error hidden"></div>
        <div id="success-message" class="alert success hidden">Success! Redirecting...</div>

        <form id="login-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="name@company.com" 
                    required
                >
            </div>

            <div class="form-group">
                <div class="label-wrapper">
                    <label for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required
                >
            </div>

            <button type="submit" id="submit-btn" class="btn-primary">
                <span class="btn-text">Sign In</span>
                <span class="spinner hidden"></span>
            </button>
        </form>

        <div class="login-footer">
            <p>New to TicketHub? <a href="#">Create an account</a></p>
        </div>
    </div>

    <!-- The compiled/transpiled JS bundle from your TS file -->
    <script src="login.js"></script>
</body>
</html>
